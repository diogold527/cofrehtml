<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cofre · Orçamento</title>
<style>
/* ===== theme.css ===== */
:root {
  color-scheme: light;
  --color-primary: #0466c8;
  --color-primary-hover: #0353a4;
  --color-primary-strong: #023e7d;
  --color-brand-deep: #002855;
  --color-brand-darker: #001845;
  --color-brand-darkest: #001233;
  --color-text: #0b1b34;
  --color-text-muted: #5c677d;
  --color-text-subtle: #7d8597;
  --color-text-soft: #979dac;
  --color-border: #e3e8f2;
  --color-border-header: #dbe6f4;
  --color-border-row: #eef1f7;
  --color-background: #eef2f9;
  --color-surface: #ffffff;
  --color-surface-soft: #f5f8fd;
  --color-surface-hover: #f8fafd;
  --color-surface-muted: #fbfcff;
  --color-surface-focus: #e8f1fb;
  --color-success: #1f9d55;
  --color-success-light: #3cbe80;
  --color-success-surface: #e4f5ec;
  --color-success-border: #bfe6cf;
  --color-warning: #d98a00;
  --color-warning-light: #f2b23c;
  --color-warning-surface: #fdf1dd;
  --color-warning-border: #f2dcae;
  --color-warning-field: #fff8e6;
  --color-warning-text: #946600;
  --color-danger: #d13b3b;
  --color-danger-light: #e56b6b;
  --color-danger-surface: #fbe6e6;
  --color-danger-border: #f0c4c4;
  --color-chart-empty: #c9d2e3;
  --color-chart-track: #eaeef6;
  --color-chart-rule: #9aa5ba;
  --color-user-1-surface: #e2edfb;
  --color-user-1-text: #0353a4;
  --color-user-2-surface: #e9e6f6;
  --color-user-2-text: #5b4bb3;
  --color-user-3-surface: #e4f5ec;
  --color-user-3-text: #1f7a48;
  --color-user-4-surface: #fdf1dd;
  --color-user-4-text: #946600;
  --color-focus-ring: rgba(4, 102, 200, .35);
  --color-brand-shadow: rgba(4, 102, 200, .18);
  --color-selected-shadow: rgba(4, 102, 200, .25);
  --color-card-shadow: rgba(2, 40, 85, .06);
  --color-header-shadow: rgba(2, 40, 85, .05);
  --color-toast-shadow: rgba(0, 24, 69, .4);
  --color-forecast: rgba(125, 141, 167, .16);
  --header-gradient: linear-gradient(180deg, var(--color-surface) 0%, var(--color-surface-focus) 100%);
  --brand-gradient: linear-gradient(180deg, #38a3ff, var(--color-primary));
  --chart-gradient: linear-gradient(180deg, var(--color-primary), var(--color-primary-hover));
  --chart-current-gradient: linear-gradient(180deg, var(--color-primary-strong), var(--color-brand-deep));
  --chart-success-gradient: linear-gradient(180deg, var(--color-success-light), var(--color-success));
  --chart-warning-gradient: linear-gradient(180deg, var(--color-warning-light), var(--color-warning));
  --chart-danger-gradient: linear-gradient(180deg, var(--color-danger-light), var(--color-danger));
  --radius-card: 14px;
  --radius-control: 9px;
  --shadow-card: 0 1px 2px var(--color-card-shadow), 0 8px 24px var(--color-card-shadow);
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --color-chart-1: #0466c8;
  --color-chart-2: #0353a4;
  --color-chart-3: #023e7d;
  --color-chart-4: #002855;
  --color-chart-5: #001845;
  --color-chart-6: #001233;
  --color-chart-7: #33415c;
  --color-chart-8: #5c677d;
  --color-chart-9: #7d8597;
  --color-chart-10: #979dac;
}

/* ===== main.css ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-width: 320px; background: var(--color-background); color: var(--color-text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
header.app { padding: 14px 20px; border-bottom: 1px solid var(--color-border-header); background: var(--header-gradient); box-shadow: 0 1px 8px var(--color-header-shadow); }
.bar { display: flex; max-width: 1180px; margin: 0 auto; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--color-primary-strong); font-weight: 700; letter-spacing: .3px; }
.brand .mark { display: grid; width: 30px; height: 30px; border-radius: 8px; background: var(--brand-gradient); box-shadow: inset 0 0 0 1px var(--color-focus-ring), 0 4px 12px var(--color-brand-shadow); color: var(--color-surface); place-items: center; }
.brand .mark svg { width: 16px; height: 16px; }
.brand small { display: block; color: var(--color-text-muted); font-size: 11px; font-weight: 400; letter-spacing: .5px; }
.spacer { flex: 1; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--color-border-header); border-radius: 10px; background: var(--color-surface-soft); }
.seg button, .monthnav button { all: unset; cursor: pointer; }
.seg button { padding: 7px 14px; border-radius: 7px; color: var(--color-text-muted); font-size: 13px; font-weight: 600; transition: .15s; }
.seg button[aria-pressed="true"] { background: var(--color-primary); box-shadow: 0 1px 6px var(--color-selected-shadow); color: var(--color-surface); }
.monthnav { display: inline-flex; padding: 3px 4px; border: 1px solid var(--color-border-header); border-radius: 10px; background: var(--color-surface-soft); align-items: center; gap: 6px; }
.monthnav button { display: grid; width: 30px; height: 30px; border-radius: 7px; color: var(--color-primary-strong); place-items: center; }
.monthnav button:hover { background: var(--color-surface-focus); }
.monthnav .lbl { min-width: 132px; color: var(--color-primary-strong); font-size: 13px; font-weight: 600; text-align: center; text-transform: capitalize; }
nav.tabs { display: flex; max-width: 1180px; margin: 0 auto; padding: 0 20px; gap: 2px; }
nav.tabs a { padding: 13px 18px; border-bottom: 2.5px solid transparent; color: var(--color-text-muted); font-size: 14px; font-weight: 600; text-decoration: none; transition: .15s; }
nav.tabs a:hover { color: var(--color-primary-strong); }
nav.tabs a[aria-current="page"] { border-color: var(--color-primary); color: var(--color-primary); }
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; animation: fade .25s ease; }
.loading { padding: 40px 0; color: var(--color-text-muted); text-align: center; }
.fatal-error { max-width: 720px; margin: 30px auto; }
.fatal-error h1 { margin-top: 0; font-size: 20px; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (max-width: 700px) {
  .bar { gap: 10px; }
  .spacer { display: none; }
  .seg { order: 3; width: 100%; }
  .seg button { flex: 1; text-align: center; }
  nav.tabs { overflow-x: auto; }
  nav.tabs a { white-space: nowrap; }
}

/* ===== components.css ===== */
.tnum { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, 1fr); }
.card { border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-surface); box-shadow: var(--shadow-card); }
.cbody { padding: 18px; }
.cbody h3 { margin: 0 0 2px; font-size: 15px; }
.hint { margin: 0 0 14px; color: var(--color-text-muted); font-size: 12px; }
.hint-topless { margin-top: 0; }
.kpi { padding: 16px 18px; }
.kpi .k-label { color: var(--color-text-muted); font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
.kpi .k-val { margin-top: 6px; font-size: 26px; font-weight: 700; }
.kpi .k-sub { margin-top: 3px; color: var(--color-text-muted); font-size: 12px; }
/* Crédito e débito compartilham a mesma família de azul: são o mesmo dinheiro
   saindo, só que por caminhos diferentes. */
.kpi-split { --method-credito: var(--color-primary); --method-debito: var(--color-primary-strong); }
.kpi-split .splitbar { display: flex; height: 7px; margin-top: 10px; border-radius: 999px; background: var(--color-border-row); overflow: hidden; }
.kpi-split .splitbar .seg { width: var(--seg-width, 0%); transition: width .4s ease; }
.kpi-split .splitbar .seg.credito { background: var(--method-credito); }
.kpi-split .splitbar .seg.debito { background: var(--method-debito); }
.kpi-split .splitbar .seg.empty { width: 100%; background: var(--color-border-row); }
.kpi-split .splitrows { display: flex; flex-direction: column; margin-top: 8px; gap: 3px; }
.kpi-split .srow { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
.kpi-split .srow .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.kpi-split .srow .dot.credito { background: var(--method-credito); }
.kpi-split .srow .dot.debito { background: var(--method-debito); }
.kpi-split .srow .nm { flex: 1; color: var(--color-text-muted); }
.kpi-split .srow .vl { font-weight: 600; }
.kpi-split .srow .pc { width: 34px; color: var(--color-text-subtle); text-align: right; }

.tag.method.credito { background: var(--color-surface-soft); color: var(--color-primary); }
.tag.method.debito { background: var(--color-primary); color: #fff; }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.good { background: var(--color-success-surface); color: var(--color-success); }
.pill.warn { background: var(--color-warning-surface); color: var(--color-warning); }
.pill.bad { background: var(--color-danger-surface); color: var(--color-danger); }
.sec-title { margin: 26px 2px 12px; color: var(--color-text-muted); font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
.empty { padding: 26px 10px; color: var(--color-text-subtle); font-size: 13px; text-align: center; }
.muted { color: var(--color-text-muted); }
.right { text-align: right; }
.inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.flex-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.flex-title-start { align-items: flex-start; }
.flex-title h3 { margin: 0; }
.scroll-x { overflow-x: auto; }
.mt-12 { margin-top: 12px; }
.mt-14 { margin-top: 14px; }
.mt-16 { margin-top: 16px; }
.hidden-input { display: none; }
label.fld { display: flex; flex-direction: column; gap: 5px; color: var(--color-text-muted); font-size: 12px; font-weight: 600; }
input, select { padding: 9px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface); color: var(--color-text); font: inherit; }
input:focus, select:focus { border-color: var(--color-primary); outline: 2px solid var(--color-focus-ring); }
.btn { all: unset; padding: 10px 16px; border-radius: var(--radius-control); background: var(--color-primary); color: var(--color-surface); cursor: pointer; font-size: 13.5px; font-weight: 700; text-align: center; transition: .15s; }
.btn:hover { background: var(--color-primary-hover); }
.btn.ghost { border: 1px solid var(--color-border); background: transparent; color: var(--color-primary-strong); }
.btn.ghost:hover { background: var(--color-surface-soft); }
.btn.danger { border: 1px solid var(--color-danger-border); background: transparent; color: var(--color-danger); }
.btn.danger:hover { background: var(--color-danger-surface); }
.btn.compact { padding: 6px 11px; }
.btn[disabled] { cursor: default; opacity: .45; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { padding: 10px 12px; border-bottom: 1px solid var(--color-border); color: var(--color-text-muted); font-size: 11.5px; letter-spacing: .5px; text-align: left; text-transform: uppercase; }
td { padding: 10px 12px; border-bottom: 1px solid var(--color-border-row); }
tr:hover td { background: var(--color-surface-hover); }
tfoot td { border-top: 1px solid var(--color-border); border-bottom: 0; background: var(--color-surface-muted); font-size: 12.5px; }
.tag { padding: 2px 8px; border-radius: 999px; background: var(--color-background); color: var(--color-primary-strong); font-size: 11px; font-weight: 600; }
.tsel { max-width: 160px; padding: 5px 7px; border-radius: 8px; font-size: 12.5px; }
.tsel.pend { border-color: var(--color-warning); background: var(--color-warning-field); color: var(--color-warning-text); font-weight: 600; }
.tin { width: 100%; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; }
.tin.amount { width: 92px; text-align: right; }
.cdot, .sw { background: var(--item-color, var(--color-chart-empty)); }
.cdot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; vertical-align: middle; }
.xbtn { all: unset; padding: 4px 7px; border-radius: 7px; color: var(--color-text-subtle); cursor: pointer; font-weight: 700; }
.xbtn:hover { background: var(--color-danger-surface); color: var(--color-danger); }
.actions { white-space: nowrap; }
.who { padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.who.tone-1 { background: var(--color-user-1-surface); color: var(--color-user-1-text); }
.who.tone-2 { background: var(--color-user-2-surface); color: var(--color-user-2-text); }
.who.tone-3 { background: var(--color-user-3-surface); color: var(--color-user-3-text); }
.who.tone-4 { background: var(--color-user-4-surface); color: var(--color-user-4-text); }
.toast { position: fixed; bottom: 22px; left: 50%; z-index: 10; padding: 11px 18px; border-radius: 11px; background: var(--color-brand-darker); box-shadow: 0 8px 30px var(--color-toast-shadow); color: var(--color-surface); font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px); transition: .28s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }

/* ===== pages/dashboard.css ===== */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; padding: 11px 13px; border: 1px solid; border-radius: 11px; align-items: flex-start; gap: 11px; }
.alert.good { border-color: var(--color-success-border); background: var(--color-success-surface); }
.alert.warn { border-color: var(--color-warning-border); background: var(--color-warning-surface); }
.alert.bad { border-color: var(--color-danger-border); background: var(--color-danger-surface); }
.alert .dot { width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; flex: none; }
.alert.good .dot { background: var(--color-success); }
.alert.warn .dot { background: var(--color-warning); }
.alert.bad .dot { background: var(--color-danger); }
.alert b { font-size: 13.5px; }
.alert span { display: block; color: var(--color-text-muted); font-size: 12.5px; }
.two { grid-template-columns: 1.05fr 1.35fr; }
.donutwrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.legend { display: flex; min-width: 180px; flex: 1; flex-direction: column; gap: 7px; }
.legend .row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.legend .nm { flex: 1; color: var(--color-text); }
.legend .pc { width: 44px; color: var(--color-text-muted); text-align: right; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 26px; }
.meter .top { display: flex; margin-bottom: 6px; align-items: baseline; justify-content: space-between; }
.meter .nm { font-size: 13.5px; font-weight: 600; }
.meter .fig { color: var(--color-text-muted); font-size: 12.5px; }
.track { position: relative; height: 9px; border-radius: 6px; background: var(--color-chart-track); overflow: hidden; }
.fill { width: var(--meter-width, 0%); height: 100%; border-radius: 6px; background: var(--meter-color, var(--color-primary)); transition: width .4s ease; }
/* Parte do limite já reservada para cobrir o estouro de outra categoria: não foi
   gasta, então não usa a cor de gasto — fica hachurada, entre o cheio e o vazio. */
.meter .track .committed { position: absolute; top: 0; right: 0; bottom: 0; width: var(--committed-width, 0%); background: repeating-linear-gradient(45deg, var(--color-chart-rule) 0 3px, var(--color-chart-empty) 3px 6px); transition: width .4s ease; }
.commit-note { display: flex; margin-top: 14px; align-items: center; gap: 8px; line-height: 1.45; }
.commit-note .swatch { width: 22px; height: 9px; border-radius: 6px; flex: none; background: repeating-linear-gradient(45deg, var(--color-chart-rule) 0 3px, var(--color-chart-empty) 3px 6px); }
.meter .pct { display: inline-block; margin-top: 4px; color: var(--meter-color, var(--color-primary)); font-size: 11.5px; font-weight: 700; }
.bars { position: relative; display: flex; height: 180px; padding: 6px 4px 0; align-items: flex-end; gap: 12px; }
.bars.short { height: 120px; }
.bcol { display: flex; height: 100%; flex: 1; flex-direction: column; align-items: center; gap: 7px; }
.bwrap { display: flex; width: 100%; flex: 1; align-items: flex-end; justify-content: center; }
.bcol .b { position: relative; width: 70%; max-width: 46px; min-height: 2px; height: var(--bar-height, 2%); border-radius: 7px 7px 3px 3px; background: var(--chart-gradient); transition: height .4s ease; }
.bcol .b.cur { background: var(--chart-current-gradient); }
.bcol .b.forecast { border: 2px dashed var(--color-text-muted); background: var(--color-forecast); }
.bcol .b.st-good { background: var(--chart-success-gradient); }
.bcol .b.st-warn { background: var(--chart-warning-gradient); }
.bcol .b.st-bad { background: var(--chart-danger-gradient); }
.bcol .b .dseg { position: absolute; right: 0; bottom: 0; left: 0; height: var(--seg-height, 0%); border-radius: 0 0 3px 3px; background: rgba(2, 62, 125, .45); }
.bcol .b .v { position: absolute; top: -18px; left: 50%; color: var(--color-text-muted); font-family: var(--font-mono); font-size: 10.5px; white-space: nowrap; transform: translateX(-50%); }
.bcol .b .v.over { color: var(--color-danger); font-weight: 700; }
.bcol .m { color: var(--color-text-muted); font-size: 11px; text-transform: capitalize; }
.bcol.now .m { color: var(--color-text); font-weight: 700; }
.capover { position: absolute; z-index: 2; inset: 6px 4px 0; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
.capover .capzone { position: relative; flex: 1; }
.capover .mspace { font-size: 11px; visibility: hidden; }
.caprule { position: absolute; right: 0; bottom: var(--cap-position, 0%); left: 0; border-top: 2px dashed var(--color-chart-rule); }
.caprule .lbl { position: absolute; top: -16px; right: 0; padding: 0 5px; border-radius: 5px; background: var(--color-surface); color: var(--color-text-muted); font-family: var(--font-mono); font-size: 10.5px; white-space: nowrap; }
.acc-grid { grid-template-columns: repeat(var(--column-count, 1), minmax(0, 1fr)); }
.acc-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.acc-header h3 { margin: 0; }
.acc-value { margin: 10px 0 14px; font-size: 28px; font-weight: 700; }
.forecast-note { margin-top: 6px; font-size: 10.5px; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .meters, .acc-grid { grid-template-columns: 1fr; } }

/* ===== pages/lancamentos.css ===== */
.formrow { display: grid; grid-template-columns: 120px 1.2fr 1.6fr 120px 90px 100px auto; align-items: end; gap: 10px; }
.filterbar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.filterbar .fld { min-width: 150px; }
.filterbar .btn { padding: 9px 14px; }
.filterbar .fcount { margin-left: auto; padding-bottom: 9px; color: var(--color-text-muted); font-size: 12px; white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
th.sortable:hover { background: var(--color-surface-soft); color: var(--color-primary-strong); }
th.sortable.on { color: var(--color-primary-strong); }
th.sortable .arw { margin-left: 5px; font-size: 9.5px; opacity: .35; }
th.sortable.on .arw { color: var(--color-primary); opacity: 1; }
.summary { display: flex; gap: 26px; flex-wrap: wrap; }
.summary .s { display: flex; flex-direction: column; }
.summary .s b { font-size: 20px; }
.summary .s span { color: var(--color-text-muted); font-size: 12px; }
.summary .pending { color: var(--color-warning); }
.summary .resolved { color: var(--color-success); }
.import-user { min-width: 130px; }
.import-day { min-width: 150px; }
@media (max-width: 900px) { .formrow { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .formrow { grid-template-columns: 1fr; } }

/* ===== pages/recorrentes.css ===== */
.ruleform { display: grid; margin-top: 14px; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: end; gap: 10px; }
.ruleform .wide { grid-column: span 2; }
.ruleform label.fld input, .ruleform label.fld select { width: 100%; min-width: 0; }
.ruleform .btn { align-self: end; padding: 10px 12px; white-space: normal; }
@media (max-width: 1100px) { .ruleform { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .ruleform { grid-template-columns: 1fr; } .ruleform .wide { grid-column: span 1; } }

/* ===== pages/configuracoes.css ===== */
.cfg-cats th:nth-child(n+3), .cfg-cats td:nth-child(n+3) { text-align: right; }
.cfg-cats input[type="number"] { width: 96px; text-align: right; }
.cfg-cats input[type="text"] { width: 100%; }
.cfg-cats input[type="color"] { width: 38px; height: 32px; padding: 2px; border-radius: 8px; }
.cfg-cats .pctcalc { font-weight: 700; }
.cfg-cats .pctcalc.good { color: var(--color-success); }
.cfg-cats .pctcalc.warn { color: var(--color-warning); }

        const colorVariable = CHART_COLOR_VARIABLES[database.categories.length % CHART_COLOR_VARIABLES.length];

        if (!category || !key) return;
        if (key === "color") category.color = event.target.value;
        else if (key === "name") category.name = event.target.value;
        else if (key === "cumulative") category.cumulative = event.target.checked;
        else if (key === "limit") category.limits[event.target.dataset.user] = Number(event.target.value) || 0;
        saveDatabase();
        renderConfig(root);
        return;
      }
      const database = getDatabase();
      if (event.target.dataset.incomeUser) database.income[event.target.dataset.incomeUser] = Number(event.target.value) || 0;
      else if (event.target.dataset.capUser) database.monthlyCap[event.target.dataset.capUser] = Number(event.target.value) || 0;
      else if (event.target.id === "threshold-warning") database.thresholds.warn = (Number(event.target.value) || 80) / 100;
      else if (event.target.id === "threshold-over") database.thresholds.over = (Number(event.target.value) || 100) / 100;

      renderConfig(root);
    });

  }

    root.innerHTML = `<div class="grid kpis">
      ${kpi("Regras ativas", activeCount, "assinaturas e parcelamentos")}
      ${kpi("Previstas no mês", dueCount, monthLabel(state.month))}
      ${kpi("Lançadas automaticamente", generatedCount, "sem precisar clicar em botão")}
      ${kpi("Total recorrente", money(recurringTotal), monthLabel(state.month))}
    </div>
    <div class="sec-title">Cadastro recorrente</div>
    <div class="card cbody">
      <h3>${editingRule ? "Editar recorrente" : "Novo recorrente"}</h3>
      <div class="ruleform">
        <label class="fld wide">Descrição<input type="text" id="rule-name" placeholder="ex.: serviço mensal" value="${escapeAttribute(ruleName)}"></label>
        <label class="fld">Categoria<select id="rule-category">${categoryOptions(database, ruleCategory)}</select></label>
        <label class="fld">Valor (R$)<input type="number" id="rule-amount" step="0.01" min="0" placeholder="0,00" value="${escapeAttribute(ruleAmount)}"></label>
        <label class="fld wide">Tipo<select id="rule-kind"><option value="M"${selected("M", ruleKind)}>Assinatura mensal</option><option value="F"${selected("F", ruleKind)}>Parcelamento até mês final</option></select></label>
        <label class="fld">Dia do mês<input type="number" id="rule-day" min="1" max="31" step="1" value="${ruleDay}"></label>
        <label class="fld">Início<input type="month" id="rule-start" value="${escapeAttribute(ruleStart)}"></label>
        <label class="fld">Final<input type="month" id="rule-end" value="${escapeAttribute(ruleEnd)}"></label>
        <label class="fld">Usuário<select id="rule-user">${userOptions(database, ruleUser)}</select></label>
        <button class="btn" type="button" id="save-rule">${editingRule ? "Salvar regra" : "Cadastrar regra"}</button>
        ${editingRule ? `<button class="btn ghost" type="button" id="cancel-rule-edit">Cancelar edição</button>` : ""}
      </div>
    </div>
    <div class="sec-title">Regras cadastradas</div>
    <div class="card scroll-x"><table><thead><tr><th>Descrição</th><th>Quem</th><th>Categoria</th><th class="right">Valor</th><th>Dia</th><th>Tipo</th><th>Período</th><th>Status em ${escapeHtml(monthLabel(state.month))}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function readRuleForm(root, toast) {
    const name = root.querySelector("#rule-name").value.trim();
    const cat = root.querySelector("#rule-category").value;
    const amount = parseFloat(root.querySelector("#rule-amount").value);
    const kind = root.querySelector("#rule-kind").value;
    const day = Math.min(31, Math.max(1, parseInt(root.querySelector("#rule-day").value, 10) || 1));
    const start = root.querySelector("#rule-start").value || getUiState().month;
    const end = root.querySelector("#rule-end").value;
    const user = root.querySelector("#rule-user").value;
    if (!name) { toast("Informe a descrição da assinatura ou parcelamento"); return null; }
    if (!(amount > 0)) { toast("Informe um valor válido"); return null; }
    if (kind === "F" && !end) { toast("Informe o mês final do parcelamento"); return null; }
    if (end && end < start) { toast("O mês final não pode ser anterior ao início"); return null; }
    return { name, cat, amount: Math.round(amount * 100) / 100, kind, day, start, end, user };
  }

  function saveRule(root, toast) {
    const formData = readRuleForm(root, toast);
    if (!formData) return false;
    const database = getDatabase();
    const state = getUiState();
    let rule = database.recurring.find(item => item.id === state.editingRuleId);
    if (rule) {
      Object.assign(rule, formData);
      setUiState({ editingRuleId: null });
      toast("Regra atualizada");
    } else {
      rule = { id: uid(), active: true, ...formData };
      database.recurring.push(rule);
      toast("Regra cadastrada");
    }
    syncGeneratedForRule(database, rule, state.month);
    saveDatabase();
    return true;
  }

  function mountPage({ root, toast }) {
    root.addEventListener("click", event => {
      if (event.target.closest("#save-rule")) { if (saveRule(root, toast)) renderRecurring(root); return; }
      if (event.target.closest("#cancel-rule-edit")) { setUiState({ editingRuleId: null }); renderRecurring(root); return; }
      const editButton = event.target.closest("[data-edit-rule]");
      if (editButton) { setUiState({ editingRuleId: editButton.dataset.editRule }); renderRecurring(root); return; }
      const toggleButton = event.target.closest("[data-toggle-rule]");
      if (toggleButton) {
        const rule = getDatabase().recurring.find(item => item.id === toggleButton.dataset.toggleRule);
        if (rule) {
          rule.active = rule.active === false;
          saveDatabase();
          renderRecurring(root);
          toast(rule.active ? "Regra ativada" : "Regra inativada");
        }
        return;
      }
      const deleteButton = event.target.closest("[data-delete-rule]");
      if (deleteButton && confirm("Excluir esta regra recorrente? Os lançamentos já criados serão mantidos.")) {
        const database = getDatabase();
        database.recurring = database.recurring.filter(rule => rule.id !== deleteButton.dataset.deleteRule);
        if (getUiState().editingRuleId === deleteButton.dataset.deleteRule) setUiState({ editingRuleId: null });
        saveDatabase();
        renderRecurring(root);
        toast("Regra excluída");
      }
    });
    return { render: () => renderRecurring(root) };
  }

  __exports.mountPage = mountPage;
});
